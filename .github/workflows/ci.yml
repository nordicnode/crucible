name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust — fmt, clippy, test, wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # The wasm-bindgen-cli version must match the wasm-bindgen crate in
      # Cargo.lock, or the wasm test runner fails with an opaque version
      # mismatch. Derive it from the lockfile so a bump moves both together.
      - name: Resolve wasm-bindgen version from Cargo.lock
        id: wasmbindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version =' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          [ -n "$version" ] || { echo "could not find wasm-bindgen in Cargo.lock" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasmbindgen.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build wasm (sim + client shim)
        run: cargo build -p crucible-sim -p crucible-ai -p crucible-evo -p crucible-client-wasm --target wasm32-unknown-unknown

      - name: Test wasm (native/wasm golden parity)
        run: cargo test -p crucible-client-wasm --target wasm32-unknown-unknown

      - name: Generate wasm bindings for client
        run: bash scripts/build-wasm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-bindings
          path: client/src/wasm
          if-no-files-found: error

  client:
    name: Client — build + test
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: wasm-bindings
          path: client/src/wasm

      - name: Install
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build:js

      - name: Test
        working-directory: client
        run: npm test
